# Vectors Gate — lock Groove Layer behavior via fixtures
#
# This is the moat protection job.
# Prevents "helpful" refactors from changing musical behavior.
# Uses: uv (Python)

name: vectors_gate

on:
  push:
    branches: [main]
    paths:
      - "packages/sg-engine/**"
      - "fixtures/**"
  pull_request:
    branches: [main]
    paths:
      - "packages/sg-engine/**"
      - "fixtures/**"

jobs:
  acceptance-vectors:
    name: Acceptance Vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for diff

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        working-directory: packages/sg-engine
        run: uv sync --all-extras

      - name: Run vector tests
        run: |
          uv run python scripts/run_vectors.py --strict

      - name: Check golden outputs match
        run: |
          uv run python scripts/check_goldens.py

      - name: Verify changelog updated (if vectors changed)
        if: github.event_name == 'pull_request'
        run: |
          # Check if any vectors changed
          VECTORS_CHANGED=$(git diff --name-only origin/main...HEAD | grep -c "fixtures/vectors" || true)
          if [ "$VECTORS_CHANGED" -gt 0 ]; then
            CHANGELOG_CHANGED=$(git diff --name-only origin/main...HEAD | grep -c "CHANGELOG.md" || true)
            if [ "$CHANGELOG_CHANGED" -eq 0 ]; then
              echo "ERROR: Vector files changed but CHANGELOG.md not updated"
              echo "Please document the behavior change in CHANGELOG.md"
              exit 1
            fi
            echo "Vectors changed and CHANGELOG updated"
          else
            echo "No vector changes"
          fi
